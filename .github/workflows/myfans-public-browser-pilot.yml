name: MyFans public modern browser pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out released code
        uses: actions/checkout@v4

      - name: Inspect preinstalled runner browser
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          printf 'OS=%s %s\n' "$NAME" "$VERSION_ID"
          node --version
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [[ -x "$candidate" ]]; then
              printf 'CHROME_PATH=%s\n' "$candidate"
              "$candidate" --version
              break
            fi
          done

      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run fixed public metadata pilot
        env:
          PILOT_OUTPUT_DIR: ${{ runner.temp }}/myfans-pilot
        run: node scripts/myfans-cloud-public-pilot.mjs --output-dir "$PILOT_OUTPUT_DIR"

      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myfans-public-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/myfans-pilot/
          if-no-files-found: error
          retention-days: 7
